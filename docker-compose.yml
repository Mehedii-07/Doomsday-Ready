services:
  db:
    image: postgres:16-alpine
    container_name: doomsday_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doomsday
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doomsday"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doomsday_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomsday_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/doomsday
      - CORS_ORIGINS=["*"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - doomsday_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doomsday_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - doomsday_network

volumes:
  pgdata:
    driver: local

networks:
  doomsday_network:
    driver: bridge
